version: 2.1

# =============================================================================
# arango-ai-sdk
#
# The version is not stored anywhere in this repository. hatch-vcs derives it
# from git at build time and CI publishes whatever comes out; the Publish step
# reads it back off the built wheel rather than computing it a second time.
#
# Release channels are carried by the version number, not by branches. Assuming
# the most recent tag is v0.2.0:
#
#   feature branch push  ->  0.2.0.post1.dev3+g1a59664   internal
#   merge into main      ->  0.2.0.post1.dev7+gc6b7b02c   internal
#   tag v0.2.0rc1        ->  0.2.0rc1                    QA candidate, the only
#                                                        build allowed on QA
#   tag v0.2.0           ->  0.2.0                       production release
#
# A dev version keeps the last tag verbatim and records where it sits relative
# to it: .postN.devD is D commits after v0.2.0, and +g<hash> names the exact
# commit, so two branches an equal distance past the tag cannot collide.
#
# Two properties this leans on:
#   - dev and rc versions are pre-releases. pip and uv skip those unless asked
#     for by name, so they never reach anyone who did not request them.
#   - an exact tag on a CLEAN tree produces the bare tag, with no +local
#     segment. Public PyPI rejects +local, so tag builds are the only ones that
#     can go there. A dirty tree silently breaks this: it yields
#     0.2.0.post1.dev0+g8ba97c9.d20260831 instead of 0.2.0.
#
# Destinations: everything currently goes to the private index (Google Artifact
# Registry). Routing tag builds to public PyPI is still open - see the TODO in
# the Publish step.
# =============================================================================

executors:
  python:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project

commands:
  install-uv:
    description: Install uv and put it on PATH for subsequent steps.
    steps:
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.6.3/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  fetch-tags:
    description: |
      hatch-vcs derives the version from 'git describe', which needs tags and real history.
      We are taking the version from the build, rather than calculating it manually.
    steps:
      - run:
          name: Fetch tags and full history
          command: |
            git fetch --unshallow 2>/dev/null || true
            git fetch --tags --force

jobs:
  # Static analysis only. Split from `test` so a red build says immediately
  # whether the problem is style or behaviour, and so the two run in parallel.
  lint:
    executor: python
    steps:
      - checkout
      - fetch-tags
      - install-uv
      - run:
          name: Sync environment
          command: uv sync --locked --group docs
      - run:
          name: Lint
          command: uv run ruff check .
      - run:
          name: Format check
          command: uv run ruff format --check .
      - run:
          name: Type check
          command: uv run ty check
      - run:
          name: Dependency check
          command: uv run deptry .
      # Same command as `make docs`. -W makes every Sphinx warning fatal, so a
      # broken cross-reference or a page missing from a toctree fails the build.
      - run:
          name: Docs build
          command: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  test:
    executor: python
    steps:
      - checkout
      - fetch-tags
      - install-uv
      - run:
          name: Sync environment
          command: uv sync --locked
      - run:
          name: Tests
          command: uv run pytest --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: unit-tests

  publish:
    executor: python
    steps:
      - checkout
      - fetch-tags
      - install-uv
      - run:
          name: Build
          command: |
            set -euo pipefail
            uv build
            ls -l dist/
      - run:
          name: Publish
          command: |
            set -euo pipefail

            for var in PYTHON_REPO_URL PYPI_ACCOUNT_USER PYPI_ACCOUNT_KEY; do
              if [ -z "${!var:-}" ]; then
                echo "${var} is not set. It comes from the pypi-private context;"
                echo "check that the context is attached to this project."
                exit 1
              fi
            done

            # PYTHON_REPO_URL may or may not carry a trailing /simple/. Normalise
            # it to a base, then derive the two URLs uv needs: one to upload to,
            # and one to read back so an already-published version is skipped
            # rather than failing the build.
            BASE_URL="${PYTHON_REPO_URL%/}"
            BASE_URL="${BASE_URL%/simple}"

            # The following line is the single source of truth for the version number.
            PUBLISHED_VERSION="$(basename "$(ls dist/*.whl | head -1)" | cut -d- -f2)"
            echo "export PUBLISHED_VERSION=${PUBLISHED_VERSION}" >> "$BASH_ENV"

            echo "Publishing ${PUBLISHED_VERSION} to ${BASE_URL}/"

            # So far, we publish only to the private PyPI.
            # TODO: route the publish step: if on a tag, publish to public PyPI, else to private.
            # suggestion:
            # if [ -n "${CIRCLE_TAG:-}" ]; then
            # uv publish --username __token__ --password "${PYPI_TOKEN}"     # public
            # else
            # BASE_URL="${PYTHON_REPO_URL%/}"; BASE_URL="${BASE_URL%/simple}"
            # uv publish --publish-url "${BASE_URL}/" --check-url "${BASE_URL}/simple/" \
            #   --username "${PYPI_ACCOUNT_USER}" --password "${PYPI_ACCOUNT_KEY}"
            # fi
            # rc tags to be decided whether to be published publicly.
            uv publish \
              --publish-url "${BASE_URL}/" \
              --check-url "${BASE_URL}/simple/" \
              --username "${PYPI_ACCOUNT_USER}" \
              --password "${PYPI_ACCOUNT_KEY}"
      - run:
          name: Summary
          command: |
            echo "Published ${PUBLISHED_VERSION}"
            echo
            echo "Install it with:"
            echo "  pip install arango-ai-sdk==${PUBLISHED_VERSION} \\"
            echo "    --extra-index-url ${PYTHON_REPO_URL}"

workflows:
  # Feature branches: check, then publish a dev version so a colleague can
  # install work in progress before it is merged. In other repos it might be called dev.
  feature:
    jobs:
      - lint:
          context:
            - pypi-private
          filters:
            branches:
              ignore: main
      - test:
          context:
            - pypi-private
          filters:
            branches:
              ignore: main
      - publish:
          context:
            - pypi-private
          requires:
            - lint
            - test
          filters:
            branches:
              ignore: main

  # A merge into main arrives here as an ordinary push to main.
  main:
    jobs:
      - lint:
          context:
            - pypi-private
          filters:
            branches:
              only: main
      - test:
          context:
            - pypi-private
          filters:
            branches:
              only: main
      - publish:
          context:
            - pypi-private
          requires:
            - lint
            - test
          filters:
            branches:
              only: main

  # Tags need an explicit opt-in: CircleCI ignores them by default, and a
  # tag-triggered workflow must also ignore all branches or it never runs.
  release:
    jobs:
      - lint:
          context:
            - pypi-private
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test:
          context:
            - pypi-private
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - publish:
          context:
            - pypi-private
          requires:
            - lint
            - test
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
