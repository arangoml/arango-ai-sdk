version: 2.1

# =============================================================================
# arango-ai-sdk
#
# The version is not stored anywhere in this repository. hatch-vcs derives it
# from git at build time and CI publishes whatever comes out; the Publish step
# reads it back off the built wheel rather than computing it a second time.
#
# Release channels are carried by the version number, not by branches. Assuming
# the most recent tag is v0.2.0:
#
#   feature branch push  ->  0.2.0.post1.dev3+g1a59664   internal
#   merge into main      ->  0.2.0.post1.dev7+gc6b7b02c   internal
#   tag v0.2.0rc1        ->  0.2.0rc1                    QA candidate, the only
#                                                        build allowed on QA
#   tag v0.2.0           ->  0.2.0                       production release
#
# A dev version keeps the last tag verbatim and records where it sits relative
# to it: .postN.devD is D commits after v0.2.0, and +g<hash> names the exact
# commit, so two branches an equal distance past the tag cannot collide.
#
# Two properties this leans on:
#   - dev and rc versions are pre-releases. pip and uv skip those unless asked
#     for by name, so they never reach anyone who did not request them.
#   - an exact tag on a CLEAN tree produces the bare tag, with no +local
#     segment. Public PyPI rejects +local, so tag builds are the only ones that
#     can go there. A dirty tree silently breaks this: it yields
#     0.2.0.post1.dev0+g8ba97c9.d20260831 instead of 0.2.0.
#
# Destinations: everything currently goes to the private index (Google Artifact
# Registry). Routing tag builds to public PyPI is still open - see the TODO in
# the Publish step.
# =============================================================================

# Exact versions only: CircleCI resolves a float at config-compile time, so a
# future orb publish would change the pipeline with no diff and no review.
orbs:
  aws-cli: circleci/aws-cli@5.1.0
  store-test-results: arangoml/store-test-results@1.0.5

# Integration-test plumbing: a test image in ECR, a chart in the dev chart
# registry, and a Jenkins-driven run inside an ephemeral platform.
parameters:
  image-name:
    type: string
    default: "arango-ai-sdk"
  image-folder:
    type: string
    default: "arango-ai-sdk"
  # The only chart this repo publishes: the helm-test pod that runs the
  # integration tests. Registered under this name in the platform's
  # infrastructure.
  tests-chart:
    type: string
    default: "arango-ai-sdk-tests"
  # Services the tests need inside the ephemeral platform, pinned to a chart
  # version so a service release cannot change this pipeline without a diff.
  # The file service must be v0.0.20 or later (custom metadata on upload).
  acp-chart:
    type: string
    default: "arango-control-plane=v0.0.23"
  file-manager-chart:
    type: string
    default: "file-manager=v0.0.22"
  autograph-chart:
    type: string
    default: "arangodb-autograph=v0.0.16"
  importer-chart:
    type: string
    default: "arangodb-graphrag-importer=v0.0.34"
  retriever-chart:
    type: string
    default: "arangodb-graphrag-retriever=v0.0.20"
  file-parser-chart:
    type: string
    default: "arangodb-file-parser=v0.1.3"
  dev-role:
    type: string
    default: "arn:aws:iam::889010145541:role/circleci-project-dev-arango-ai-sdk"
  login-role:
    type: string
    default: "889010145541.dkr.ecr.us-east-1.amazonaws.com"
  dev-image:
    type: string
    description: "Full development image path including service name (used for Docker builds)"
    default: "889010145541.dkr.ecr.us-east-1.amazonaws.com/release/dev/arango-ai-sdk/service"
  dev-image-base:
    type: string
    description: "Base development registry path without service name (used for chart generation)"
    default: "889010145541.dkr.ecr.us-east-1.amazonaws.com/release/dev"
  region:
    type: string
    default: "us-east-1"

executors:
  python:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
  framework:
    docker:
      # Framework CICD image: carries framework-helper, helm and docker.
      - image: 889010145541.dkr.ecr.us-east-1.amazonaws.com/release/prd/framework/runner:v0.2.40@sha256:8a755fd2b5b6cf588a5ff49c78ab0214e904387310d967c5381e5fd9336729b1
        aws_auth:
          oidc_role_arn: << pipeline.parameters.dev-role >>

commands:
  install-uv:
    description: Install uv and put it on PATH for subsequent steps.
    steps:
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.6.3/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  fetch-tags:
    description: |
      hatch-vcs derives the version from 'git describe', which needs tags and real history.
      We are taking the version from the build, rather than calculating it manually.
    steps:
      - run:
          name: Fetch tags and full history
          command: |
            git fetch --unshallow 2>/dev/null || true
            git fetch --tags --force

  export-short-version:
    description: |
      One name for the test image tag and the chart version, so the chart
      always points at the image built from the same commit.
    steps:
      - run:
          name: Export short version
          command: |
            # Falls back to v0.0.0 while the repository has no tag: an empty
            # prefix would make an invalid image tag ("-g<sha>").
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
            echo "export SHORT_VERSION=${LAST_TAG}-g$(echo ${CIRCLE_SHA1} | cut -c -7)" >> "$BASH_ENV"

jobs:
  # Static analysis only. Split from `test` so a red build says immediately
  # whether the problem is style or behaviour, and so the two run in parallel.
  lint:
    executor: python
    steps:
      - checkout
      - fetch-tags
      - install-uv
      - run:
          name: Sync environment
          command: uv sync --locked --group docs
      - run:
          name: Lint
          command: uv run ruff check .
      - run:
          name: Format check
          command: uv run ruff format --check .
      - run:
          name: Type check
          command: uv run ty check
      - run:
          name: Dependency check
          command: uv run deptry .
      # Same command as `make docs`. -W makes every Sphinx warning fatal, so a
      # broken cross-reference or a page missing from a toctree fails the build.
      - run:
          name: Docs build
          command: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  test:
    executor: python
    steps:
      - checkout
      - fetch-tags
      - install-uv
      - run:
          name: Sync environment
          command: uv sync --locked
      - run:
          name: Tests
          command: uv run pytest --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: unit-tests

  publish:
    executor: python
    steps:
      - checkout
      - fetch-tags
      - install-uv
      - run:
          name: Build
          command: |
            set -euo pipefail
            uv build
            ls -l dist/
      - run:
          name: Publish
          command: |
            set -euo pipefail

            for var in PYTHON_REPO_URL PYPI_ACCOUNT_USER PYPI_ACCOUNT_KEY; do
              if [ -z "${!var:-}" ]; then
                echo "${var} is not set. It comes from the pypi-private context;"
                echo "check that the context is attached to this project."
                exit 1
              fi
            done

            # PYTHON_REPO_URL may or may not carry a trailing /simple/. Normalise
            # it to a base, then derive the two URLs uv needs: one to upload to,
            # and one to read back so an already-published version is skipped
            # rather than failing the build.
            BASE_URL="${PYTHON_REPO_URL%/}"
            BASE_URL="${BASE_URL%/simple}"

            # The following line is the single source of truth for the version number.
            PUBLISHED_VERSION="$(basename "$(ls dist/*.whl | head -1)" | cut -d- -f2)"
            echo "export PUBLISHED_VERSION=${PUBLISHED_VERSION}" >> "$BASH_ENV"

            echo "Publishing ${PUBLISHED_VERSION} to ${BASE_URL}/"

            # So far, we publish only to the private PyPI.
            # TODO: route the publish step: if on a tag, publish to public PyPI, else to private.
            # suggestion:
            # if [ -n "${CIRCLE_TAG:-}" ]; then
            # uv publish --username __token__ --password "${PYPI_TOKEN}"     # public
            # else
            # BASE_URL="${PYTHON_REPO_URL%/}"; BASE_URL="${BASE_URL%/simple}"
            # uv publish --publish-url "${BASE_URL}/" --check-url "${BASE_URL}/simple/" \
            #   --username "${PYPI_ACCOUNT_USER}" --password "${PYPI_ACCOUNT_KEY}"
            # fi
            # rc tags to be decided whether to be published publicly.
            uv publish \
              --publish-url "${BASE_URL}/" \
              --check-url "${BASE_URL}/simple/" \
              --username "${PYPI_ACCOUNT_USER}" \
              --password "${PYPI_ACCOUNT_KEY}"
      - run:
          name: Summary
          command: |
            echo "Published ${PUBLISHED_VERSION}"
            echo
            echo "Install it with:"
            echo "  pip install arango-ai-sdk==${PUBLISHED_VERSION} \\"
            echo "    --extra-index-url ${PYTHON_REPO_URL}"

  # ---- Integration tests --------------------------------------------------
  test-image-commit-dev:
    executor: framework
    steps:
      - checkout
      - fetch-tags
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: '<< pipeline.parameters.dev-role >>'
          region: << pipeline.parameters.region >>
      - run: aws ecr get-login-password --region << pipeline.parameters.region >> | docker login --username AWS --password-stdin << pipeline.parameters.login-role >>
      - export-short-version
      - run:
          name: Build test image
          command: docker build -f Dockerfile.test . -t "<< pipeline.parameters.dev-image >>-test:${SHORT_VERSION}"
      - run:
          name: Push test image
          command: docker push "<< pipeline.parameters.dev-image >>-test:${SHORT_VERSION}"

  chart-commit-dev:
    executor: framework
    steps:
      - checkout
      - fetch-tags
      - aws-cli/setup:
          role_arn: '<< pipeline.parameters.dev-role >>'
          region: << pipeline.parameters.region >>
      - export-short-version
      - run: >
          bash charts/patch.sh charts/ dest/ \
            "${SHORT_VERSION}" \
            "<< pipeline.parameters.dev-image-base >>" \
          << pipeline.parameters.tests-chart >>
      - run: stat "dest/<< pipeline.parameters.tests-chart >>-${SHORT_VERSION}.tgz"
      - run: aws s3 cp "dest/<< pipeline.parameters.tests-chart >>-${SHORT_VERSION}.tgz" "s3://arangodb-platform-dev-chart-registry/charts/<< pipeline.parameters.image-folder >>/<< pipeline.parameters.tests-chart >>/${SHORT_VERSION}/<< pipeline.parameters.tests-chart >>-${SHORT_VERSION}.tgz"

  refresh-dev:
    executor: framework
    steps:
      - checkout
      - aws-cli/setup:
          role_arn: '<< pipeline.parameters.dev-role >>'
          region: << pipeline.parameters.region >>
      - run: framework-helper snf --arn "arn:aws:states:us-east-1:889010145541:stateMachine:arangodb-platform-dev-lambda-s3" --version "<< pipeline.parameters.image-name >>"

  integration-test:
    executor: framework
    steps:
      - checkout
      - fetch-tags
      - run:
          name: Check for skip-integration-test marker
          command: |
            if git log -1 --pretty=%B | grep -q '\[skip-integration-test\]'; then
              echo "Commit message contains [skip-integration-test], skipping integration tests."
              circleci-agent step halt
            fi
      - export-short-version
      - run:
          name: Create File Parser values file
          # One worker of each kind is enough for the tests and leaves room in
          # the node pool for the services installed after it.
          command: |
            printf '%s' '{"workerDefault": {"replicas": 1}, "workerPdf": {"replicas": 1}}' \
              > /tmp/file_parser_values.json
            echo "export FILE_PARSER_VALUES=@/tmp/file_parser_values.json" >> "$BASH_ENV"
      - run:
          name: Create tests values file
          # The provider keys come from the LLM-KEYS context and reach the test
          # pod through chart values, never through the image. Never print
          # this file.
          command: |
            printf '{"CHAT_API_KEY":"%s","EMBEDDING_API_KEY":"%s"}' \
              "${CHAT_API_KEY}" "${EMBEDDING_API_KEY}" > /tmp/tests_values.json
            echo "export TESTS_VALUES=@/tmp/tests_values.json" >> "$BASH_ENV"
            echo "CHAT_API_KEY present: $([ -n "${CHAT_API_KEY}" ] && echo yes || echo NO)"
            echo "EMBEDDING_API_KEY present: $([ -n "${EMBEDDING_API_KEY}" ] && echo yes || echo NO)"
      - run:
          name: Run integration tests
          # --chart declares the charts the ephemeral platform may install,
          # --service installs them up front, --test runs the helm-test pod.
          # ACP and the file service are installed because every test talks to
          # them; the file parser because corpus builds call it. AutoGraph, the
          # importer and the retriever are only declared: the tests install
          # them through ACP, the way a user does.
          command: |
            framework-helper jenkins ci \
              --user "$MY_CI_USERNAME" \
              --pass "$MY_CI_PASSWORD" \
              --timeout "1h" \
              --chart "<< pipeline.parameters.acp-chart >>" \
              --chart "<< pipeline.parameters.file-manager-chart >>" \
              --chart "<< pipeline.parameters.file-parser-chart >>" \
              --chart "<< pipeline.parameters.autograph-chart >>" \
              --chart "<< pipeline.parameters.importer-chart >>" \
              --chart "<< pipeline.parameters.retriever-chart >>" \
              --chart "<< pipeline.parameters.tests-chart >>=${SHORT_VERSION}" \
              --service arango-control-plane \
              --service file-manager \
              --service "arangodb-file-parser=${FILE_PARSER_VALUES}" \
              --service "<< pipeline.parameters.tests-chart >>=${TESTS_VALUES}" \
              --test << pipeline.parameters.tests-chart >>
          no_output_timeout: "60m"
      # Finds the JUnit XML the test pod wrote to /debug and stores it.
      - store-test-results/collect-and-store

workflows:
  # Feature branches: check, then publish a dev version so a colleague can
  # install work in progress before it is merged. In other repos it might be called dev.
  feature:
    jobs:
      - lint:
          context:
            - pypi-private
          filters:
            branches:
              ignore: main
      - test:
          context:
            - pypi-private
          filters:
            branches:
              ignore: main
      - publish:
          context:
            - pypi-private
          requires:
            - lint
            - test
          filters:
            branches:
              ignore: main
      - test-image-commit-dev:
          context: aws
          requires:
            - lint
            - test
          filters:
            branches:
              ignore: main
      - chart-commit-dev:
          context: aws
          requires:
            - test-image-commit-dev
          filters:
            branches:
              ignore: main
      - refresh-dev:
          context: aws
          requires:
            - chart-commit-dev
          filters:
            branches:
              ignore: main
      - integration-test:
          context:
            - aws
            - ArangoML-CI-Jenkins
            - LLM-KEYS
          requires:
            - refresh-dev
          filters:
            branches:
              ignore: main

  # A merge into main arrives here as an ordinary push to main.
  main:
    jobs:
      - lint:
          context:
            - pypi-private
          filters:
            branches:
              only: main
      - test:
          context:
            - pypi-private
          filters:
            branches:
              only: main
      - publish:
          context:
            - pypi-private
          requires:
            - lint
            - test
          filters:
            branches:
              only: main

  # Tags need an explicit opt-in: CircleCI ignores them by default, and a
  # tag-triggered workflow must also ignore all branches or it never runs.
  release:
    jobs:
      - lint:
          context:
            - pypi-private
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test:
          context:
            - pypi-private
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - publish:
          context:
            - pypi-private
          requires:
            - lint
            - test
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
