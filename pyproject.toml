[tool.poetry]
name = "arango-ai"
version = "0.1.0a1"
description = "Python SDK for the Arango AI Suite (alpha): AutoGraph end-to-end workflow through the platform gateway"
authors = ["ArangoDB <info@arangodb.com>"]
readme = "README.md"
repository = "https://github.com/arangoml/arango-ai-sdk"
packages = [{ include = "arango_ai", from = "src" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
httpx = ">=0.27,<1.0"
# attrs + python-dateutil are runtime deps of the generated client
attrs = ">=23.0"
python-dateutil = ">=2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
respx = "^0.22"
black = "^25.1"
isort = "^6.0"
flake8 = "^7.1"
mypy = "^1.14"
bandit = "^1.8"
pre-commit = "^4.0"
# Codegen toolchain. Pinned exactly: regeneration must be deterministic so
# `make regen-check` can prove committed generated code matches the spec.
openapi-python-client = "0.23.1"
# openapi-python-client shells out to ruff to format its own output. Ruff is
# NOT used to lint hand-written code (that stays black/isort/flake8/mypy).
ruff = "^0.9"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
extend-exclude = "src/arango_ai/_generated/"

[tool.isort]
profile = "black"
extend_skip = ["src/arango_ai/_generated"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/arango_ai"]
exclude = ["src/arango_ai/_generated/"]

[[tool.mypy.overrides]]
module = "arango_ai._generated.*"
follow_imports = "skip"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", "src/arango_ai/_generated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
