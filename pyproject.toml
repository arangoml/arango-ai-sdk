[project]
name = "arango-ai-sdk"
dynamic = ["version"]
description = "Python SDK for the Arango AI Suite that helps developers build a context graph in a few steps."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ArangoDB AI Services"}]
keywords = ["arangodb", "graphrag", "autograph", "autorag", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "betterproto==2.0.0b7",
    "pydantic>=2.0",
    "python-arango>=8.3.4",
    "requests>=2.34.2",
    "requests-toolbelt>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty",
    "pytest>=8",
    "pytest-cov>=6",
    "pre-commit>=4",
    "deptry>=0.25.1",
    "ipython>=9.17.0",
    "python-dotenv>=1.0",
    "grpcio-tools>=1.83.1",
    "betterproto[compiler]==2.0.0b7",
    "datamodel-code-generator>=0.64.0",
]
# Documentation build only. Kept apart from `dev` so the SDK's runtime and test
# environment never depends on Sphinx. Install with `uv sync --group docs`.
docs = [
    "sphinx>=8.1",
    "furo>=2024.8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# We use pure hatch versioning of packages.
# tag builds take tag as a version.
# non-tag builds (most cases) will take hatch-vcs, e.g., 0.2.0.post1.dev3+gc6b7b02c5
# 3 --> distance from commit on 0.2.0
# +g******* is the local git hash to distinguish between different commits that
# have the same distance away from the tag.
raw-options = { version_scheme = "no-guess-dev"}

[tool.hatch.build.targets.wheel]
packages = ["src/arango_ai_sdk"]

[tool.uv]
# betterproto 2.0.0b7 is a pre-release; without this uv refuses to resolve it.
prerelease = "allow"

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated by `make generate-proto` and `make generate-openapi`; not hand-written, not linted.
extend-exclude = ["src/arango_ai_sdk/_proto_out", "src/arango_ai_sdk/_openapi_out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
# numpydoc: sections (Parameters/Returns/Raises/Attributes) with dashed
# underlines.
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests and their fixtures: style rules still apply, but a docstring is not
# required on every test module, class and function (D1xx).
"tests/**" = ["D1"]
# Demo notebooks: the cells are the documentation. Progress helpers do not
# need a numpy docstring.
"examples/**/*.ipynb" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["arango_ai_sdk"]

[tool.ty.src]
exclude = ["src/arango_ai_sdk/_proto_out", "src/arango_ai_sdk/_openapi_out"]

[tool.deptry]
known_first_party = ["arango_ai_sdk"]
extend_exclude = ["tests", "docs", "examples", "src/arango_ai_sdk/_proto_out"]
ignore = ["DEP002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = ["integration: hits a live platform; needs credentials"]
