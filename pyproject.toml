[project]
name = "arango-ai-sdk"
dynamic = ["version"]
description = "Python SDK for the Arango AI Suite that helps developers build a context graph in a few steps."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ArangoDB AI Services"}]
keywords = ["arangodb", "graphrag", "autograph", "autorag", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "arango-platform-clients>=0.1.34",
    "python-arango>=8.3.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty",
    "pytest>=8",
    "pytest-cov>=6",
    "pre-commit>=4",
    "deptry>=0.25.1",
    "ipython>=9.17.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# We use pure hatch versioning of packages.
# tag builds take tag as a version.
# non-tag builds (most cases) will take hatch-vcs, e.g., 0.2.0.post1.dev3+gc6b7b02c5
# 3 --> distance from commit on 0.2.0
# +g******* is the local git hash to distinguish between different commits that
# have the same distance away from the tag.
raw-options = { version_scheme = "no-guess-dev"}

[tool.hatch.build.targets.wheel]
packages = ["src/arango_ai_sdk"]

[tool.uv]
# Auth for the private index comes from keyring via the
# keyrings.google-artifactregistry-auth plugin, which mints a token from the
# local gcloud login. `oauth2accesstoken` in the URL is the username uv hands
# to keyring. Install once with:
#   uv tool install keyring --with keyrings.google-artifactregistry-auth
keyring-provider = "subprocess"
# arango-platform-clients pins betterproto==2.0.0b7 (a pre-release).
prerelease = "allow"

[[tool.uv.index]]
name = "arango_private"
url = "https://oauth2accesstoken@europe-west3-python.pkg.dev/arango-ml/arango-ml-internal-pypi/simple/"
explicit = true

[tool.uv.sources]
arango-platform-clients = { index = "arango_private"}

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
# numpydoc: sections (Parameters/Returns/Raises/Attributes) with dashed
# underlines.
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests and their fixtures: style rules still apply, but a docstring is not
# required on every test module, class and function (D1xx).
"tests/**" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["arango_ai_sdk"]

[tool.deptry]
known_first_party = ["arango_ai_sdk"]
extend_exclude = ["tests"]
ignore = ["DEP002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: hits a live platform; needs credentials"]
