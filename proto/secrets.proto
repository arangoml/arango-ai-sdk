syntax = "proto3";

package secrets;

import "google/protobuf/timestamp.proto";

// ProfileType defines the type/category of a secret profile
enum ProfileType {
  PROFILE_TYPE_UNSPECIFIED = 0;
  PROFILE_TYPE_LLM = 1;
  PROFILE_TYPE_DATABASE = 2;
  PROFILE_TYPE_CLOUD_STORAGE = 3;
  PROFILE_TYPE_API_KEY = 4;
  PROFILE_TYPE_OAUTH = 5;
  PROFILE_TYPE_SSH = 6;
  PROFILE_TYPE_CUSTOM = 7;
}

// Profile represents a secret profile with metadata and encrypted data
message Profile {
  // Unique identifier for the profile
  string profile_id = 1;

  // The type/category of this profile
  ProfileType profile_type = 2;

  // Human-readable name for the profile
  string name = 3;

  // Optional description of the profile
  optional string description = 4;

  // Non-sensitive metadata associated with the profile
  map<string, string> metadata = 5;

  // The sensitive data to be encrypted at rest
  map<string, string> secret_data = 6;

  // Version number for optimistic locking
  int32 version = 7;

  // Timestamp when the profile was created
  google.protobuf.Timestamp created_at = 8;

  // Timestamp when the profile was last updated
  google.protobuf.Timestamp updated_at = 9;
}

// ProfileList contains a list of profile IDs for a database
message ProfileList {
  repeated string profile_ids = 1;
}

// --- Secrets Management Messages ---
// The internal secrets.Profile and ProfileType from secrets.proto (arango-platform-clients)
// are used by the handler layer. The API surface uses string-based profile_type
// for better client DX (e.g. "LLM", "DATABASE" instead of numeric enums).

// API-facing secret profile with string-based profile_type.
message SecretProfile {
  string profile_id = 1;
  string profile_type = 2;  // e.g. "LLM", "DATABASE", "CUSTOM"
  string name = 3;
  string description = 4;
  map<string, string> metadata = 5;
  string secret_data = 6;  // Obfuscated in responses
  int32 version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string provider = 10;  // e.g. "openai", "anthropic", "openrouter"
}

// Summary of a secret profile for list operations (no secret data exposed).
message SecretProfileSummary {
  string profile_id = 1;
  string profile_id_masked = 2;
  string profile_type = 3;  // e.g. "LLM", "DATABASE"
  string name = 4;
  string description = 5;
  string provider = 6;  // e.g. "openai", "anthropic"
}

// Request to create a new secret profile.
message CreateSecretProfileRequest {
  string profile_type = 1;  // e.g. "LLM", "DATABASE", "CUSTOM"
  string name = 2;
  string secret_data = 3;
  optional string description = 4;
  map<string, string> metadata = 5;
  optional string profile_id = 6;
  optional string provider = 7;  // e.g. "openai", "anthropic", "openrouter"
}

// Request to retrieve a secret profile by ID.
message GetSecretProfileRequest {
  string profile_id = 1;
}

// Request to fully update an existing secret profile.
message UpdateSecretProfileRequest {
  string profile_id = 1;
  string profile_type = 2;  // e.g. "LLM", "DATABASE", "CUSTOM"
  string name = 3;
  optional string description = 4;
  map<string, string> metadata = 5;
  string secret_data = 6;
  optional string provider = 7;  // e.g. "openai", "anthropic", "openrouter"
}

// Request to partially update a secret profile. Only provided fields are updated.
message PartialUpdateSecretProfileRequest {
  string profile_id = 1;
  optional string name = 2;
  optional string description = 3;
  map<string, string> metadata = 4;
  string secret_data = 5;
  optional string profile_type = 6;  // e.g. "LLM", "DATABASE", "CUSTOM"
  optional string provider = 7;  // e.g. "openai", "anthropic", "openrouter"
}

// Request to delete a secret profile by ID.
message DeleteSecretProfileRequest {
  string profile_id = 1;
}

// Response for a delete operation.
message DeleteSecretProfileResponse {
  bool deleted = 1;
  string message = 2;
}

// Response containing a single secret profile (secret values are obfuscated).
message SecretProfileResponse {
  SecretProfile profile = 1;
}

// Request to list secret profiles with optional filtering and pagination.
message ListSecretProfilesRequest {
  optional string profile_type = 1;  // e.g. "LLM", "DATABASE"
  optional string name_contains = 2;
  optional int32 limit = 3;
  int32 offset = 4;
  optional string provider = 5;  // e.g. "openai", "anthropic"
}

// Response containing a paginated list of secret profile summaries.
message ListSecretProfilesResponse {
  repeated SecretProfileSummary profiles = 1;
  int32 total = 2;
  optional int32 limit = 3;
  int32 offset = 4;
  bool has_more = 5;
}

// A single item in a batch create request.
message SecretProfileCreateItem {
  string profile_type = 1;  // e.g. "LLM", "DATABASE", "CUSTOM"
  string name = 2;
  string secret_data = 3;
  optional string description = 4;
  map<string, string> metadata = 5;
  optional string profile_id = 6;
  optional string provider = 7;  // e.g. "openai", "anthropic", "openrouter"
}

// Request to create multiple secret profiles in a batch.
message CreateSecretProfilesRequest {
  repeated SecretProfileCreateItem profiles = 1;
}

// Request to delete multiple secret profiles by their IDs.
message DeleteSecretProfilesRequest {
  repeated string profile_ids = 1;
}

// Represents a failed operation in a batch.
message BatchSecretProfileFailure {
  string profile_id = 1;
  string error = 2;
}

// Response for batch operations with per-item success/failure tracking.
message BatchSecretProfileResponse {
  repeated string succeeded = 1;
  repeated BatchSecretProfileFailure failed = 2;
}

// Request to get all available secret profile types.
message GetBaseImagesRequest {}

message GetBaseImagesResponse {
  repeated string python_images = 1;
  repeated string nodejs_images = 2;
}

message GetSecretProfileTypesRequest {}

// Information about a provider for a secret profile type.
message ProviderInfo {
  string name = 1;
  optional string description = 2;
}

// Information about a single secret profile type.
message SecretProfileTypeInfo {
  string type = 1;
  int32 value = 2;
  string description = 3;
  repeated ProviderInfo providers = 4;
}

// Response containing all available secret profile types.
message GetSecretProfileTypesResponse {
  repeated SecretProfileTypeInfo profile_types = 1;
}
