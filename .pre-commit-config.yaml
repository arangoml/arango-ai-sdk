repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates are rendered before they are YAML. {{ }} fails this check.
        exclude: ^charts/.*/templates/
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4  # keep in sync with the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.3
    hooks:
      - id: uv-lock
  # Local hook: deptry needs the project's installed environment to resolve
  # imports to distributions, so it can't run from an isolated remote-repo hook.
  - repo: local
    hooks:
      - id: deptry
        name: deptry (dependency check)
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: \.(py|toml)$
