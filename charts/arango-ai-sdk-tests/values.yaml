---
# This chart exists only to run the SDK's integration tests inside a platform
# deployment (templates/tests/). The SDK has no service of its own, so there is
# no application image here; charts/patch.sh stamps the test image only.
images:
  test:
    registry: PLACEHOLDER
    image: arango-ai-sdk/service-test
    tag: PLACEHOLDER
    kind: Test
imagePullSecrets: []

# Deployment
arangodb_platform:
  deployment:
    name: PLACEHOLDER

# Profiles
profiles: ""

# Provider keys for the tests that deploy AutoGraph and run its pipeline.
# Delivered at run time by CI through a values file, never baked into the
# test image. Empty means those tests skip.
CHAT_API_KEY: ""
EMBEDDING_API_KEY: ""

# Pytest target inside the test image. The integration job keeps the default.
# The system job overrides it with tests/system.
pytestPath: tests/integration

# When true, a missing provider key fails the run instead of skipping. Set
# only by the system-test job.
requireSystemTests: false
