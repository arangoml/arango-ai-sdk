{{- /*
Provider keys for the test pod. Rendered only when CI passes a key through the
chart values; the pod reads them with secretKeyRef, so a key never appears in
the pod spec or in the debug package uploaded after a run.
*/}}
{{- if or .Values.CHAT_API_KEY .Values.EMBEDDING_API_KEY }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "template.releaseName" . }}-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ template "template.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.CHAT_API_KEY }}
  chat-api-key: {{ .Values.CHAT_API_KEY | quote }}
  {{- end }}
  {{- if .Values.EMBEDDING_API_KEY }}
  embedding-api-key: {{ .Values.EMBEDDING_API_KEY | quote }}
  {{- end }}
{{- end }}
