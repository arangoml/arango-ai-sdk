                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/orchestrate:
        post:
            tags:
                - CorpusGraphServiceV1
            description: |-
                TriggerAutographOrchestration spawns graphrag_importer workers and executes
                 builds for all strategy profiles in corpus_rags. Returns orchestration_id
                 immediately; the pipeline runs in the background.
            operationId: CorpusGraphServiceV1_TriggerAutographOrchestration
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TriggerOrchestrationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TriggerOrchestrationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/orchestrate/{orchestrationId}:
        get:
            tags:
                - CorpusGraphServiceV1
            description: |-
                GetOrchestrationStatus returns the current status of an orchestration run,
                 including per-job details and importer failure messages.
                 Poll this endpoint after POST /v1/orchestrate to track progress.
                 Status lifecycle: "running" → "completed" | "failed" | "cancelled"
                 Returns 404 if the orchestration_id is unknown, invalid, or has been evicted
            operationId: CorpusGraphServiceV1_GetOrchestrationStatus
            parameters:
                - name: orchestrationId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetOrchestrationStatusResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - CorpusGraphServiceV1
            description: |-
                CancelOrchestration asks the running orchestration to stop and release the
                 single-flight slot, so an operator can clear a wedged run without database
                 surgery (AIS-1809). Cancellation is cooperative: the run terminalises at its
                 next consumption-loop pass, tears down its own importer service, and frees
                 the slot -- bounded by one importer HTTP timeout, so allow up to ~2 minutes.
                 A run still holding the slot ORCHESTRATION_CANCEL_GRACE_SECONDS after the
                 request is force-released by the admission reaper instead.
                 Returns 404 when orchestration_id is not the run currently holding the slot
                 (already terminal, unknown, or evicted).
            operationId: CorpusGraphServiceV1_CancelOrchestration
            parameters:
                - name: orchestrationId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CancelOrchestrationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/projects/{project}:
        delete:
            tags:
                - CorpusGraphServiceV1
            description: |-
                DeleteProject synchronously removes all AutoGraph-owned artifacts for a
                 project. The running AutoGraph service is torn down only after the success
                 response has been sent to the caller.
                 delete_files is intentionally a query parameter (?delete_files=true). Do NOT
                 add `body: "*"` here: DELETE bodies are frequently stripped by clients and
                 proxies, and a body binding would silently drop the deliberate file-wipe
                 opt-in. See DeleteProjectRequest.delete_files.
            operationId: CorpusGraphServiceV1_DeleteProject
            parameters:
                - name: project
                  in: path
                  required: true
                  schema:
                    type: string
                - name: deleteFiles
                  in: query
                  description: |-
                    Query parameter (?delete_files=true), NOT a request body. The DELETE HTTP
                     binding declares no `body`, so grpc-gateway populates this from the query
                     string and ignores any JSON body. Defaults to false: a full File Manager
                     wipe requires the caller to opt in deliberately via ?delete_files=true.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteProjectResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/projects/{project}/categories/{category}:
        delete:
            tags:
                - CorpusGraphServiceV1
            description: |-
                DeleteCategory removes a whole category (module alias) synchronously.
                 The corpus/KG contribution of the category is cleaned first
                 (delete_module_data), then, when delete_files is true and the category has
                 files, they are deleted via the File Manager shared library by scope + name.
                 Deletion respects each file's stored safe_to_delete flag: files with
                 safe_to_delete=true are removed; files with safe_to_delete=false (locked)
                 are reported in locked_skipped and left intact. A category that has no files
                 ("unused") unregisters its empty scope instead of deleting; an unknown
                 category is 404. Rejected with 409 while a corpus build or orchestration is
                 in progress.
            operationId: CorpusGraphServiceV1_DeleteCategory
            parameters:
                - name: project
                  in: path
                  required: true
                  schema:
                    type: string
                - name: category
                  in: path
                  required: true
                  schema:
                    type: string
                - name: deleteFiles
                  in: query
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteCategoryResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/projects/{project}/model-config/credentials:
        put:
            tags:
                - CorpusGraphServiceV1
            description: |-
                UpdateModelConfig persists the AutoGraph model/provider configuration with
                 inline validation, in-place pod updates, and diff-then-write metadata
                 persistence. Validates provider/model/key inline and applies changes to
                 the running pod without rebuild (no idle-only restriction).
                 Chat providers: "openai" | "triton" | "custom". Embedding: "openai" | "custom".
                 `custom` is an OpenAI-compatible endpoint; only client construction maps it to openai.
                 All fields required except multimodal_model (optional) and chat_api_url /
                 embedding_api_url (optional unless the corresponding provider is "custom",
                 in which case that URL is required).
            operationId: CorpusGraphServiceV1_UpdateModelConfig
            parameters:
                - name: project
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateModelConfigRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelConfigCredentialsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
