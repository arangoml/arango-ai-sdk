        DeleteProjectResponse:
            type: object
            properties:
                deleted:
                    type: boolean
                project:
                    type: string
                collectionsDeleted:
                    type: array
                    items:
                        type: string
                graphsDeleted:
                    type: array
                    items:
                        type: string
                servicesDeleted:
                    type: array
                    items:
                        type: string
                filesDeleted:
                    type: integer
                    format: int32
                lockedSkipped:
                    type: array
                    items:
                        type: string
                warnings:
                    type: array
                    items:
                        type: string
                viewsDeleted:
                    type: array
                    items:
                        type: string
            description: |-
                DeleteProjectResponse reports every resource removed by the synchronous
