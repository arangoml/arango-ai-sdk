openapi: 3.0.3
info:
    title: CorpusGraphServiceV1 API
    description: CorpusGraphServiceV1 provides endpoints for importing files and building corpus graphs.
    version: 0.0.1
paths:
    /v1/corpus/builds:
        post:
            tags:
                - CorpusGraphServiceV1
            description: |-
                CreateCorpusBuild triggers a corpus build using validated uploaded files.
                 The build runs in the background and returns immediately with a corpus_build_id.
            operationId: CorpusGraphServiceV1_CreateCorpusBuild
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCorpusBuildRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateCorpusBuildResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/corpus/builds/{corpusBuildId}:
        get:
            tags:
                - CorpusGraphServiceV1
            description: |-
                GetBuildStatus retrieves the current status of a corpus build.

                 DEVELOPER NOTE: This endpoint is primarily for monitoring and debugging purposes.
                 Since CreateCorpusBuild runs in the background and returns immediately with a
                 corpus_build_id, use this endpoint to:
                 - Monitor the progress of long-running corpus builds (which can take hours)
                 - Check if a build completed successfully or failed
                 - Debug issues by viewing error messages and progress percentages
                 - Track build lifecycle from "pending" → "running" → "completed"/"failed"

                 The corpus build process includes: file reading, embedding generation, document
                 insertion, vector indexing, similarity finding, clustering, and graph creation.
                 Poll this endpoint periodically to track progress through these stages.
            operationId: CorpusGraphServiceV1_GetBuildStatus
            parameters:
                - name: corpusBuildId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetBuildStatusResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/embed-field-in-collection:
        post:
            tags:
                - CorpusGraphServiceV1
            description: |-
                EmbedFieldInCollection generates embeddings for documents in a collection that
                 do not yet have the embedding field, stores them in <field>_embedding, and
                 creates vector index and ArangoSearch view for that field. Single collection,
                 single field per request; repeated calls are incremental.
            operationId: CorpusGraphServiceV1_EmbedFieldInCollection
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EmbedFieldInCollectionRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EmbedFieldInCollectionResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/graph/delete:
        post:
            tags:
                - CorpusGraphServiceV1
            description: |-
                DeleteDocuments removes a batch of documents from the corpus graph
                 (Layer 1/2) and cleans up the importer knowledge graph (Layer 3).
            operationId: CorpusGraphServiceV1_DeleteDocuments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteDocumentsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteDocumentsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/graph/insert:
        post:
            tags:
                - CorpusGraphServiceV1
            description: |-
                InsertDocuments adds a batch of new documents into an existing corpus
                 graph: embed, insert into sources, assign to the most similar cluster, and
                 wire up similarity + domain edges. Returns a per-file status.
            operationId: CorpusGraphServiceV1_InsertDocuments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InsertDocumentsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InsertDocumentsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/graph/recluster:
        post:
            tags:
                - CorpusGraphServiceV1
            description: |-
                TriggerRecluster manually schedules Layer-3 reclustering for one or more
                 partitions. Reclustering is manual-only: AutoGraph tracks per-partition
                 divergence and flags needs_reclustering (surfaced on per-file responses and
                 persisted on the rags node) once a partition crosses its threshold, but it
                 never reclusters on its own -- the user decides whether the recluster
                 is worth its cost and invokes this endpoint. Progress and the terminal
                 outcome are surfaced via the project-metadata importerOrchestration slot.

                 Effectively a MAINTENANCE-WINDOW operation: a recluster claims the single
                 service-wide mutation slot and holds it for its whole run (up to ~1h),
                 blocking all inserts/updates/deletes/builds meanwhile. Reclusters are
                 serialized -- in a multi-partition request only one runs at a time and the
                 rest defer (~10s) rather than queueing, staying flagged for a later
                 re-trigger -- so reclustering N partitions blocks writes for roughly the sum
                 of their run times. Run it during a quiet window and keep batches small (see
                 the per-request cap on TriggerReclusterRequest.partition_ids).
            operationId: CorpusGraphServiceV1_TriggerRecluster
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TriggerReclusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TriggerReclusterResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/graph/update:
        post:
            tags:
                - CorpusGraphServiceV1
            description: |-
                UpdateDocuments replaces a batch of documents (delete leg then insert leg)
                 under a single mutation slot. Returns immediately; the delete+insert runs
                 in the background and progress is surfaced via the importerOrchestration
                 status slot.
            operationId: CorpusGraphServiceV1_UpdateDocuments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateDocumentsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateDocumentsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/health:
        get:
            tags:
                - CorpusGraphServiceV1
            description: |-
                HealthCheck returns the health status of the service.
                 Use this endpoint for monitoring and readiness checks.
            operationId: CorpusGraphServiceV1_HealthCheck
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthCheckResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/import-multiple:
        post:
            tags:
                - CorpusGraphServiceV1
            description: ImportMultipleFiles accepts multiple files and imports them into the corpus graph.
            operationId: CorpusGraphServiceV1_ImportMultipleFiles
            requestBody:
