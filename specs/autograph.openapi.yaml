                    format: int32
                documentsExamined:
                    type: integer
                    format: int32
                documentsFailed:
                    type: integer
                    format: int32
                documentsIneligible:
                    type: integer
                    format: int32
            description: EmbedFieldInCollectionResponse contains the result of the embed operation.
        FileInput:
            type: object
            properties:
                docName:
                    type: string
                content:
                    type: string
                    format: bytes
                citableUrl:
                    type: string
                metadata:
                    type: string
            description: FileInput represents a single file to be imported with inline content.
        GetBuildStatusResponse:
            type: object
            properties:
                corpusBuildId:
                    type: string
                status:
                    type: string
                message:
                    type: string
                progress:
                    type: integer
                    format: int32
                error:
                    type: string
                startedAt:
                    type: number
                    format: double
                completedAt:
                    type: number
                    format: double
                errorCode:
                    type: string
                graphName:
                    type: string
                documentCount:
                    type: integer
                    format: int32
                clusterCount:
                    type: integer
                    format: int32
                documentsAdded:
                    type: integer
                    format: int32
                documentsRemoved:
                    type: integer
                    format: int32
                documentsUnchanged:
                    type: integer
                    format: int32
            description: GetBuildStatusResponse contains the current status of a corpus build.
        GetOrchestrationStatusResponse:
            type: object
            properties:
                orchestrationId:
                    type: string
                status:
                    type: string
                totalJobs:
                    type: integer
                    format: int32
                completedJobs:
                    type: integer
                    format: int32
                failedJobs:
                    type: integer
                    format: int32
                message:
                    type: string
                jobs:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrchestrationJobResult'
            description: GetOrchestrationStatusResponse returns the live or final status of an orchestration run.
        GetProjectOverviewResponse:
            type: object
            properties:
                project:
                    type: string
                corpusGraph:
                    $ref: '#/components/schemas/CorpusGraphOverview'
                knowledgeGraph:
                    $ref: '#/components/schemas/KnowledgeGraphOverview'
                strategies:
                    $ref: '#/components/schemas/StrategiesOverview'
                categories:
                    type: array
                    items:
                        $ref: '#/components/schemas/CategoryOverview'
                categoryCount:
                    type: integer
                    format: int32
                totalDocuments:
                    type: integer
                    format: int32
                filteredTotalDocuments:
                    type: integer
                    format: int32
            description: GetProjectOverviewResponse contains the Project Overview aggregate read.
        GetRagStrategizerJobStatusResponse:
            type: object
            properties:
                status:
                    type: string
                progress:
                    type: number
                    format: float
                clustersTotal:
                    type: integer
                    format: int32
                clustersDone:
                    type: integer
                    format: int32
            description: GetRagStrategizerJobStatusResponse contains live progress of an analyze run.
        GetRagStrategizerStrategyResponse:
            type: object
            properties:
                strategies:
                    type: array
                    items:
                        $ref: '#/components/schemas/RagStrategy'
                totalStrategies:
                    type: integer
                    format: int32
                strategyTypeCounts:
                    type: object
                    additionalProperties:
                        type: integer
                        format: int32
            description: GetRagStrategizerStrategyResponse contains all RAG strategies.
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        HealthCheckResponse:
            type: object
            properties:
                status:
                    type: string
                    description: status can be "SERVING" or "NOT_SERVING"
                message:
                    type: string
                    description: |-
                        message carries an optional human-readable detail. When customer LLM
                         tracing (AIS-1530) is enabled it holds a JSON per-provider health
                         snapshot; otherwise a short status string. Consumers keying on `status`
                         are unaffected.
            description: HealthCheckResponse contains the health status of the service.
        ImportMultipleFilesRequest:
            type: object
            properties:
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/FileInput'
                module:
                    type: string
            description: ImportMultipleFilesRequest contains the files to be imported.
        ImportMultipleFilesResponse:
            type: object
            properties:
                success:
                    type: boolean
                message:
                    type: string
                errorMessage:
                    type: string
            description: ImportMultipleFilesResponse contains the result of the import operation.
        InsertDocumentsRequest:
            type: object
            properties:
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/InsertFileInput'
                category:
                    type: string
                    description: |-
                        Category label (e.g. "legal") whose corpus partition scopes similarity +
                         clustering, resolved server-side under GENAI_PROJECT_NAME as in
                         POST /v1/corpus/builds. Empty resolves to the project's only category;
                         required once a project has more than one.
            description: |-
                InsertDocumentsRequest contains a batch of File Manager files to insert into
                 an existing corpus graph.
        InsertDocumentsResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/InsertFileStatus'
            description: InsertDocumentsResponse returns one status entry per input file.
        InsertFileInput:
            type: object
            properties:
                docName:
                    type: string
                fileId:
                    type: string
            description: |-
                InsertFileInput represents a single File Manager file to insert into an
                 existing corpus graph.
        InsertFileStatus:
            type: object
            properties:
                docName:
                    type: string
                success:
                    type: boolean
                errorMessage:
                    type: string
                ragPartitionId:
                    type: string
                clusterKey:
                    type: string
                fileId:
                    type: string
            description: InsertFileStatus is the per-file outcome of an insert.
        KnowledgeGraphOverview:
            type: object
            properties:
                name:
                    type: string
                status:
                    type: string
                entityCount:
                    type: integer
                    format: int32
                relationshipCount:
                    type: integer
                    format: int32
                stale:
                    type: boolean
                newCategories:
                    type: array
                    items:
                        type: string
                removedCategories:
                    type: array
                    items:
                        type: string
            description: KnowledgeGraphOverview describes the knowledge graph card on the Overview page.
        Layer3PartitionDeleteResult:
            type: object
            properties:
                ragPartitionId:
                    type: string
                status:
                    enum:
                        - LAYER3_DELETE_STATUS_UNSPECIFIED
                        - LAYER3_DELETE_STATUS_SUCCESS
                        - LAYER3_DELETE_STATUS_FAILED
                        - LAYER3_DELETE_STATUS_NOT_ATTEMPTED
                    type: string
                    format: enum
                errorMessage:
                    type: string
                documentsRemoved:
                    type: integer
                    format: int32
                chunksRemoved:
                    type: integer
                    format: int32
                entitiesRemoved:
                    type: integer
                    format: int32
                communitiesRemoved:
                    type: integer
                    format: int32
                semanticUnitsRemoved:
                    type: integer
                    format: int32
                edgesRemoved:
                    type: integer
                    format: int32
            description: |-
                Per-partition result of the Layer-3 delete. Counts are Autograph's own AQL
                 removal totals for that partition's batch.
        ModelConfigCredentialsResponse:
            type: object
            properties:
                applied:
                    type: boolean
                valid:
                    type: boolean
                appliedToRunningPod:
                    type: boolean
                rebuildRequired:
                    type: boolean
                keyStatus:
                    type: string
                field:
                    type: string
                    description: 'On validation error (valid=false), these fields are populated:'
                errorCode:
                    type: string
                message:
                    type: string
            description: |-
                ModelConfigCredentialsResponse returns validation status and application
                 results for UpdateModelConfig. Always returns HTTP 200; validation failures
                 are signaled via valid=false + populated field/error_code/message (clients
                 key off these fields, not the HTTP status code).
        OrchestrationJobResult:
            type: object
            properties:
                ragPartitionId:
                    type: string
                strategyType:
                    type: string
                status:
                    type: string
                retryCount:
                    type: integer
                    format: int32
                errorMessage:
                    type: string
                category:
                    type: string
                divergenceScore:
                    type: number
                    description: |-
                        AIS-1444: the partition's divergence, computed at the right time -- right
                         after Layer 3 actually created/grew this partition's entities. This is the
                         authoritative score (the insert/update responses no longer carry a premature
                         one); it is also persisted on the rags node. Populated on the terminal poll
                         once the job is completed.
                    format: double
                needsReclustering:
                    type: boolean
            description: OrchestrationJobResult contains the outcome of a single orchestration job.
        RagStrategy:
            type: object
            properties:
                clusterId:
                    type: string
                strategyType:
                    type: string
                ragPartitionId:
                    type: string
                entityTypes:
                    type: array
                    items:
                        type: string
                documentCount:
                    type: integer
                    format: int32
                parameters:
                    type: object
                    additionalProperties:
                        type: string
            description: RagStrategy represents a single RAG strategy for a cluster/domain.
        ReclusterPartitionStatus:
            type: object
            properties:
                ragPartitionId:
                    type: string
                accepted:
                    type: boolean
                errorMessage:
                    type: string
            description: |-
                ReclusterPartitionStatus is the per-partition scheduling outcome. The recluster
                 itself runs in the background; this only reports whether it was accepted for
                 scheduling. For progress, the project-metadata importerOrchestration status slot
                 carries the running/completed/failed of a single job at a time -- with several
                 partitions their writes overwrite one another, so it is NOT a per-partition
                 ledger. The authoritative per-partition outcome is the rags node itself:
                 needs_reclustering (cleared on success) and last_reclustered_at; poll those per
                 partition when reclustering more than one.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StrategiesOverview:
            type: object
            properties:
                stale:
                    type: boolean
                categoriesWithoutStrategies:
                    type: array
                    items:
                        type: string
            description: StrategiesOverview describes the strategies block on the Overview page.
        TriggerOrchestrationRequest:
            type: object
            properties:
                project:
                    type: string
                replicas:
                    type: integer
                    format: int32
                maxRetries:
                    type: integer
                    format: int32
                importerEnv:
                    type: object
                    additionalProperties:
                        type: string
                chatSecretProfileIds:
                    type: array
                    items:
                        type: string
                embeddingSecretProfileId:
                    type: string
                categories:
                    type: array
                    items:
                        type: string
                fileIds:
                    type: array
                    items:
                        type: string
            description: |-
                TriggerOrchestrationRequest contains parameters for the orchestration pipeline.
                 Secrets are resolved via secret manager using the profile IDs below.
        TriggerOrchestrationResponse:
            type: object
            properties:
                orchestrationId:
                    type: string
                success:
                    type: boolean
                message:
                    type: string
                totalJobs:
                    type: integer
                    format: int32
                completedJobs:
                    type: integer
                    format: int32
                failedJobs:
                    type: integer
                    format: int32
                jobResults:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrchestrationJobResult'
                unmatchedFileIds:
                    type: array
                    items:
                        type: string
            description: TriggerOrchestrationResponse is returned immediately when orchestration starts.
        TriggerRAGStrategizerRequest:
            type: object
            properties:
                project:
                    type: string
                complexity:
                    enum:
                        - very_low
                        - low
                        - moderate
                        - high
                        - very_high
                    type: string
                    format: enum
                extractImagesDefault:
                    type: boolean
                categories:
                    type: array
                    items:
                        type: string
                maxParallelClusters:
                    type: integer
                    format: int32
            description: TriggerRAGStrategizerRequest contains parameters for RAG strategy analysis.
        TriggerRAGStrategizerResponse:
            type: object
            properties:
                strategizeJobId:
                    type: string
            description: |-
                TriggerRAGStrategizerResponse is returned when the strategizer job is accepted.
                 Results are stored in rags collection and can be queried from the database.
        TriggerReclusterRequest:
            type: object
            properties:
                partitionIds:
                    type: array
                    items:
                        type: string
            description: |-
                TriggerReclusterRequest names the RAG partitions to recluster. At least one
                 partition id is required, and at most a small server-defined maximum per
                 request (RECLUSTER_MAX_PARTITIONS_PER_REQUEST) -- reclusters are serialized and
                 each blocks all writes for its full run, so oversized batches are rejected
                 rather than silently deferring most of the work. Split large reclustering into
                 smaller batches, ideally during a maintenance window.
        TriggerReclusterResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReclusterPartitionStatus'
            description: TriggerReclusterResponse returns one scheduling result per requested partition.
        UpdateDocumentsRequest:
            type: object
            properties:
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/InsertFileInput'
                module:
                    type: string
                category:
                    type: string
                    description: |-
                        Preferred. Category label (bare or already-encoded, see InsertDocumentsRequest.category)
                         scoping similarity + clustering. Alias for module when module is empty.
            description: |-
                UpdateDocumentsRequest contains a batch of files to replace in an existing
                 corpus graph. Files are referenced by File Manager id, exactly as
                 InsertDocumentsRequest does: the replacement content is always read back from
                 the File Manager, never sent inline.
        UpdateDocumentsResponse:
            type: object
            properties:
                updateId:
                    type: string
                accepted:
                    type: boolean
                message:
                    type: string
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/UpdateFileStatus'
            description: |-
                UpdateDocumentsResponse is returned immediately when an update starts. The
                 delete+insert runs in the background; poll the project-metadata
                 importerOrchestration status slot for progress and the terminal outcome.
        UpdateFileStatus:
            type: object
            properties:
                docName:
                    type: string
                deleteDone:
                    type: boolean
                insertSuccess:
                    type: boolean
                errorMessage:
                    type: string
                clusterKey:
                    type: string
                ragPartitionId:
                    type: string
                fileId:
                    type: string
                previousClusterKey:
                    type: string
            description: |-
                UpdateFileStatus is the per-file outcome of an update. When ``delete_done``
                 is true but ``insert_success`` is false, the file was removed from the graph
                 and the caller should re-add it via POST /v1/graph/insert.
        UpdateModelConfigRequest:
            type: object
            properties:
                project:
                    type: string
                chatApiProvider:
                    type: string
                embeddingApiProvider:
                    type: string
                chatModel:
                    type: string
                embeddingModel:
                    type: string
                chatSecretProfileId:
                    type: string
                embeddingSecretProfileId:
                    type: string
                multimodalModel:
                    type: string
                chatApiUrl:
                    type: string
                embeddingApiUrl:
                    type: string
            description: |-
                UpdateModelConfigRequest carries the model/provider configuration to persist
                 into project metadata (AiProject.model_settings, project-level field 7 in
                 the shared project_metadata proto — survives AutoGraph service
                 teardown/redeploy). Chat and embedding are configured independently.
                 project/service/db are resolved server-side from the deployment environment.
                 Project name is validated against the service's configured GENAI_PROJECT_NAME.
        UpdateRagStrategizerStrategyRequest:
            type: object
            properties:
                clusterId:
                    type: string
                strategyType:
                    type: string
                entityTypes:
                    type: array
                    items:
                        type: string
                extractImages:
                    type: boolean
            description: UpdateRagStrategizerStrategyRequest contains the fields to override for a cluster strategy.
        UpdateRagStrategizerStrategyResponse:
            type: object
            properties:
                strategy:
                    $ref: '#/components/schemas/RagStrategy'
            description: UpdateRagStrategizerStrategyResponse returns the updated strategy.
tags:
    - name: CorpusGraphServiceV1
