            description: CategoryOverview describes one row in the categories list on the Overview page.
        CorpusGraphOverview:
            type: object
            properties:
                name:
                    type: string
                status:
                    type: string
                documentCount:
                    type: integer
                    format: int32
                clusterCount:
                    type: integer
                    format: int32
                stale:
                    type: boolean
                graphExplorerUrl:
                    type: string
            description: CorpusGraphOverview describes the corpus graph card on the Overview page.
        CreateCorpusBuildRequest:
            type: object
            properties:
                embeddingStrategy:
                    type: string
                strategy:
                    $ref: '#/components/schemas/BuildStrategy'
                fileIds:
                    type: array
                    items:
                        type: string
                modules:
                    type: array
                    items:
                        type: string
                incremental:
                    type: boolean
                categories:
                    type: array
                    items:
                        type: string
                    description: |-
                        field 6 (scope) retired; replaced by categories below.
                         Preferred. Category labels resolved via File Manager under GENAI_PROJECT_NAME.
                         An already-encoded module label (today's persisted form) is also accepted as a legacy alias.
                         Mutually exclusive with modules and file_ids (returns 400 if multiple provided).
                         See user_facing_documentation.md §3 for full contract (precedence, default, examples).
            description: CreateCorpusBuildRequest contains parameters for triggering a corpus build.
        CreateCorpusBuildResponse:
            type: object
            properties:
                corpusBuildId:
                    type: string
                graphName:
                    type: string
            description: CreateCorpusBuildResponse contains the corpus build ID.
